<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Financeiro — Casa</title>
<style>
  /* ===========================================================
     DECISÃO DE DESIGN: paleta minimalista, neutra, separada do
     roxo/laranja da New Consig (esse painel é de uso doméstico,
     não deve se confundir visualmente com o CRM do negócio).
     =========================================================== */
  :root {
    --bg: #f7f7f5;
    --surface-1: #ffffff;
    --surface-2: #f0f0ed;
    --border: #e1e0d9;
    --text-primary: #1a1a18;
    --text-secondary: #6b6a64;
    --text-muted: #999790;
    --accent: #1baf7a;
    --accent-dark: #0f6e56;
    --blue: #2a78d6;
    --amber: #eda100;
    --red: #d03b3b;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  /* Cabeçalho: mês + novo gasto */
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav button {
    border: none; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); width: 32px; height: 32px; cursor: pointer;
    font-size: 16px; color: var(--text-secondary);
  }
  .month-label {
    font-size: 15px; font-weight: 600; padding: 6px 16px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
  }
  #novoGastoBtn {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent); color: #fff; border: none;
    padding: 8px 14px; border-radius: var(--radius); font-size: 14px; cursor: pointer;
    font-weight: 500;
  }
  #novoGastoBtn:hover { background: var(--accent-dark); }

  /* Formulário retrátil de novo gasto */
  #novoGastoForm {
    display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 20px;
  }
  #novoGastoForm .row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  #novoGastoForm .row2 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  #novoGastoForm label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  #novoGastoForm input, #novoGastoForm select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: var(--bg);
  }
  .pag-toggle { display: flex; gap: 6px; }
  .pag-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); cursor: pointer; font-size: 13px;
  }
  .pag-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #salvarGastoBtn {
    background: var(--text-primary); color: #fff; border: none; padding: 9px 16px;
    border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  #formStatus { font-size: 12px; margin-top: 8px; color: var(--text-muted); }

  /* KPIs */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; position: relative;
  }
  .kpi-card .label { font-size: 12px; color: var(--text-secondary); margin: 0 0 6px; }
  .kpi-card .value { font-size: 20px; font-weight: 600; margin: 0; }
  .kpi-card.editable { cursor: pointer; }
  .kpi-card.editable:hover { border-color: var(--accent); }
  .kpi-card.editable .value input {
    width: 100%; font-size: 20px; font-weight: 600; border: none; background: transparent;
    padding: 0; font-family: inherit; color: var(--text-primary);
  }
  .kpi-hint { font-size: 10px; color: var(--text-muted); position: absolute; top: 10px; right: 10px; }

  /* Layout principal: gráfico + objetivos lado a lado */
  .main-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
  @media (max-width: 720px) { .main-grid { grid-template-columns: 1fr; } }

  .section-title { font-size: 14px; color: var(--text-secondary); margin: 0 0 10px; font-weight: 500; }
  .chart-wrap { position: relative; width: 100%; height: 240px; margin-bottom: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .obj-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #novoObjBtn {
    font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); cursor: pointer;
  }
  .obj-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; }
  .obj-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .obj-top .pct { color: var(--text-secondary); }
  .progress-track { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .obj-values { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  #novoObjForm { display: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  #novoObjForm input { width: 100%; padding: 7px 9px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  #novoObjForm button { width: 100%; padding: 8px; border: none; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }

  #loadingMsg, #errorMsg { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  #errorMsg { color: var(--red); display: none; }

  /* Accordion de detalhamento por categoria */
  .cat-item { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  .cat-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; }
  .cat-header .seta { transition: transform 0.15s; color: var(--text-muted); font-size: 12px; }
  .cat-header.aberto .seta { transform: rotate(90deg); }
  .cat-total { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
  .cat-lista { display: none; border-top: 1px solid var(--border); }
  .cat-lista.aberto { display: block; }
  .cat-linha { display: flex; justify-content: space-between; padding: 8px 16px; font-size: 13px; border-top: 1px solid var(--surface-2); }
  .cat-linha .desc { color: var(--text-primary); }
  .cat-linha .info { color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header-row">
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mês anterior">&#8592;</button>
      <span class="month-label" id="monthLabel">—</span>
      <button id="nextMonth" aria-label="Próximo mês">&#8594;</button>
    </div>
    <button id="novoGastoBtn">+ Novo gasto</button>
  </div>

  <!-- Formulário retrátil: só aparece ao clicar em "+ Novo gasto" -->
  <div id="novoGastoForm">
    <div class="row">
      <div><label>Produto</label><input id="fProduto" placeholder="Ex: Tênis Puma"></div>
      <div><label>Valor total</label><input id="fValor" placeholder="R$ 0,00"></div>
      <div><label>Categoria (Onde?)</label><select id="fCategoria"></select></div>
    </div>
    <div class="row2">
      <div id="parcelasField"><label>Parcelas (total de vezes)</label><input id="fParcelas" placeholder="Ex: 6" value="1"></div>
      <div>
        <label>Forma de pagamento</label>
        <div class="pag-toggle">
          <button type="button" id="btnCartao" class="active">Cartão</button>
          <button type="button" id="btnPix">Pix</button>
        </div>
      </div>
      <button id="salvarGastoBtn">Adicionar</button>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;margin-top:10px;color:var(--text-secondary)">
      <input type="checkbox" id="fFixo" style="width:auto"> Gasto recorrente (repete todo mês, ex: aluguel/financiamento da casa)
    </label>
    <p id="formStatus"></p>
  </div>

  <div id="loadingMsg">Carregando dados da planilha…</div>
  <div id="errorMsg"></div>

  <div id="dashboard" style="display:none">

    <div class="kpi-grid">
      <div class="kpi-card" id="kpiFixoMensal">
        <p class="label">Gasto do mês</p>
        <p class="value" id="kpiFixoMensalValue">R$ 0,00</p>
      </div>
      <div class="kpi-card">
        <p class="label">Gasto no próximo mês</p>
        <p class="value" id="kpiFixoProximo">R$ 0,00</p>
      </div>
      <div class="kpi-card">
        <p class="label">Parcelas em aberto próx. mês</p>
        <p class="value" id="kpiParcelasProximo">R$ 0,00</p>
      </div>
      <div class="kpi-card editable" id="kpiReserva">
        <p class="label">Reserva de emergência</p>
        <p class="value" id="kpiReservaValue">R$ 0,00</p>
        <span class="kpi-hint">editar</span>
      </div>
    </div>

    <div style="margin-bottom:28px">
      <div class="obj-header">
        <p class="section-title" style="margin:0">Limites de gastos</p>
        <button id="novoLimiteBtn">+ Novo</button>
      </div>
      <div id="novoLimiteForm" style="display:none;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end">
          <div><label style="font-size:11px;color:var(--text-muted)">Nome</label><input id="lNome" placeholder="Ex: iFood"></div>
          <div><label style="font-size:11px;color:var(--text-muted)">Categoria ou palavra-chave</label><input id="lTermo" placeholder="Ex: ifood, Lazer, Mercado"></div>
          <div><label style="font-size:11px;color:var(--text-muted)">Limite mensal</label><input id="lLimite" placeholder="R$ 0,00"></div>
          <button id="salvarLimiteBtn">Salvar</button>
        </div>
      </div>
      <div class="kpi-grid" id="limitesList"></div>
    </div>

    <div class="main-grid">
      <div>
        <p class="section-title">Médio prazo — por categoria</p>
        <div class="chart-wrap"><canvas id="medioChart" role="img" aria-label="Gráfico de barras empilhadas com parcelas comprometidas nos próximos meses, por categoria"></canvas></div>
        <div class="legend" id="medioLegend"></div>
      </div>

      <div>
        <div class="obj-header">
          <p class="section-title" style="margin:0">Objetivos do casal</p>
          <button id="novoObjBtn">+ Novo</button>
        </div>
        <div id="novoObjForm">
          <input id="oNome" placeholder="Nome do objetivo">
          <input id="oMeta" placeholder="Valor da meta (R$)">
          <button id="salvarObjBtn">Salvar objetivo</button>
        </div>
        <div id="objList"></div>
      </div>
    </div>

    <div style="margin-top:28px">
      <p class="section-title">Gastos por categoria</p>
      <select id="categoriaSelect" style="width:100%;max-width:280px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface-1);margin-bottom:12px"></select>
      <div id="categoriaDetalhe"></div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* =================================================================
   CONFIGURAÇÃO
   - CSV_URL: link do Google Sheets publicado na web (Arquivo >
     Compartilhar > Publicar na web > formato CSV). Enquanto não
     configurado, o painel mostra dados de exemplo.
   - APPS_SCRIPT_URL: endpoint de um Google Apps Script Web App
     que faz o append da nova linha na planilha (a publicação CSV
     é só leitura, então "Novo gasto" precisa desse endpoint
     separado para poder escrever). Ver instruções de setup.
   ================================================================= */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkd-V78VXrjBiR3DMFXDapRVWzx4PuyCE4R4RmmxMCJbLbNQ6HJc6dFKFK9XPWSIzPHRwEEAWxngKK/pub?gid=0&single=true&output=csv"; // <- cole aqui o link publicado do Google Sheets
const DATA_INICIO = new Date(2026, 8, 1); // 1º de setembro de 2026 — gastos antes disso (lançamentos de teste/calibração) são ignorados no painel
const APPS_SCRIPT_URL = ""; // <- cole aqui a URL do Apps Script Web App

const CORES = ['#2a78d6', '#1baf7a', '#eda100', '#e87ba4', '#4a3aa7', '#e34948', '#8a6d3b', '#3b8a8a', '#c26bcf', '#6ba33b', '#b3893b', '#3b5fb3', '#b33b6e'];

// Lista fixa de categorias configurada como validação de dados na planilha
// (Categoria). Mantida aqui pra sempre aparecer no seletor, mesmo sem gasto
// lançado ainda naquela categoria no mês.
const CATEGORIAS_PADRAO = ['Alimentação', 'Assinatura', 'Casa', 'Estética', 'Lazer', 'Mercado', 'Saúde', 'Transporte', 'Presentes', 'Vestuário', 'Viagem', 'Carro', 'Ifood', 'Outros'];

let dados = [];       // linhas parseadas da planilha
let categorias = [];  // lista fixa da planilha + qualquer categoria extra encontrada nos dados
let mesSelecionado = new Date(2026, 8, 1); // inicia em setembro/2026 (início da série real de dados)

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function fmtMoeda(v) {
  return 'R$ ' + (Math.round(v * 100) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
}

function chaveMs(date) { return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0'); }

/* -----------------------------------------------------------------
   PARSE DA PLANILHA
   Estrutura real gravada pelo agente N8N via WhatsApp:
   Identificador, Numero, Descrição, Categoria, Tipo (saida/entrada),
   Data, Valor, MetodoPagamento (CREDITO/PIX/DEBITO), Cartao, Parcelas
   (número total de parcelas — sem "atual x total", pois a linha é
   gravada uma única vez, no momento da compra).
   Datas vêm no formato DD-MM-AAAA.
   ----------------------------------------------------------------- */
function parseData(dataStr) {
  if (!dataStr) return new Date();
  const partes = String(dataStr).split('-');
  if (partes.length === 3 && partes[0].length === 2) {
    // DD-MM-AAAA
    return new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
  }
  return new Date(dataStr);
}

function parseValorBR(str) {
  let s = String(str || '0').trim().replace(/[^\d,.-]/g, '');
  if (s.includes(',')) {
    // Tem vírgula -> padrão BR: ponto é milhar, vírgula é decimal
    s = s.replace(/\./g, '').replace(',', '.');
  } else {
    // Sem vírgula: se o último grupo depois do ponto tem 3 dígitos
    // (ex: "1.750"), é separador de milhar, não decimal (ex: R$1.750,00)
    const m = s.match(/\.(\d{3})$/);
    if (m && (s.match(/\./g) || []).length === 1) {
      s = s.replace('.', '');
    }
  }
  return parseFloat(s) || 0;
}

function parseLinha(row) {
  const parcelasRaw = String(row['Parcelas'] || '1').trim();
  const fixo = parcelasRaw.toLowerCase() === 'recorrente';
  const total = fixo ? null : (parseInt(parcelasRaw) || 1);
  const valorTotal = parseValorBR(row['Valor']);
  const parcelaValor = fixo ? valorTotal : valorTotal / total;
  const data = parseData(row['Data']);
  return {
    produto: row['Descrição'] || row['Descricao'] || '',
    tipo: (row['Tipo'] || 'saida').toLowerCase(),
    valorTotal, parcelaValor, atual: 1, total, fixo, data,
    formaPag: row['MetodoPagamento'] || '',
    cartao: row['Cartao'] || row['Cartão'] || '',
    onde: row['Categoria'] || 'Outros'
  };
}

/* -----------------------------------------------------------------
   PROJEÇÃO DE MÉDIO PRAZO
   Para cada compra parcelada ainda em aberto (atual < total),
   projeta as parcelas restantes nos meses seguintes ao mês da
   linha (Data), uma por mês, mesmo valor de "Parcela".
   Gastos marcados como "Recorrente" (Parcelas = "Recorrente") repetem o valor
   total todo mês, do mês da Data até o limite do gráfico (ateData).
   Retorna: { 'YYYY-MM': { categoria: valor, ... } }
   ----------------------------------------------------------------- */
function calcularProjecao(linhas, ateData) {
  const projecao = {};
  const somar = (chave, categoria, valor) => {
    if (!projecao[chave]) projecao[chave] = {};
    projecao[chave][categoria] = (projecao[chave][categoria] || 0) + valor;
  };
  linhas.filter(l => l.tipo !== 'entrada').forEach(l => {
    if (l.fixo) {
      let cursor = new Date(l.data.getFullYear(), l.data.getMonth(), 1);
      while (cursor <= ateData) {
        somar(chaveMs(cursor), l.onde, l.valorTotal);
        cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      }
    } else {
      for (let i = l.atual; i <= l.total; i++) {
        const offset = i - l.atual;
        const dataParcela = new Date(l.data.getFullYear(), l.data.getMonth() + offset, 1);
        somar(chaveMs(dataParcela), l.onde, l.parcelaValor);
      }
    }
  });
  return projecao;
}

function proximosMeses(base, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push(new Date(base.getFullYear(), base.getMonth() + i, 1));
  }
  return out;
}

/* ------------------------------ RENDER ------------------------------ */
let chartInstance = null;

function render() {
  document.getElementById('monthLabel').textContent =
    MESES[mesSelecionado.getMonth()] + ' ' + mesSelecionado.getFullYear();

  const meses5 = proximosMeses(mesSelecionado, 5);
  const projecao = calcularProjecao(dados, meses5[meses5.length - 1]);
  const chaveProximo = chaveMs(new Date(mesSelecionado.getFullYear(), mesSelecionado.getMonth() + 1, 1));

  // KPI: parcelas em aberto no próximo mês (soma de todas categorias)
  const projProximo = projecao[chaveProximo] || {};
  const totalProximo = Object.values(projProximo).reduce((a, b) => a + b, 0);
  document.getElementById('kpiParcelasProximo').textContent = fmtMoeda(totalProximo);

  // KPI: gasto do mês selecionado e do mês seguinte (soma pelas PARCELAS
  // que vencem naquele mês — inclui parcelamentos antigos ainda em aberto,
  // não só compras feitas naquele mês)
  const somaProjecaoMes = (mes) => Object.values(projecao[chaveMs(mes)] || {}).reduce((a, b) => a + b, 0);

  const proximoMesObj = new Date(mesSelecionado.getFullYear(), mesSelecionado.getMonth() + 1, 1);
  document.getElementById('kpiFixoMensalValue').textContent = fmtMoeda(somaProjecaoMes(mesSelecionado));
  document.getElementById('kpiFixoProximo').textContent = fmtMoeda(somaProjecaoMes(proximoMesObj));

  const reserva = parseFloat(localStorage.getItem('kpiReserva') || '0');
  document.getElementById('kpiReservaValue').textContent = fmtMoeda(reserva);

  // Gráfico médio prazo
  const datasets = categorias.map((cat, idx) => ({
    label: cat,
    data: meses5.map(m => (projecao[chaveMs(m)] || {})[cat] || 0),
    backgroundColor: CORES[idx % CORES.length]
  }));

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('medioChart'), {
    type: 'bar',
    data: { labels: meses5.map(m => MESES[m.getMonth()]), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, grid: { color: '#e1e0d9' }, ticks: { callback: v => 'R$ ' + v.toLocaleString('pt-BR') } }
      },
      plugins: { legend: { display: false } }
    }
  });

  document.getElementById('medioLegend').innerHTML = categorias.map((cat, idx) =>
    `<span><span class="dot" style="background:${CORES[idx % CORES.length]}"></span>${cat}</span>`
  ).join('');

  // Popula select de categoria no formulário de novo gasto
  const sel = document.getElementById('fCategoria');
  if (sel.options.length === 0) {
    categorias.forEach(c => { const o = document.createElement('option'); o.textContent = c; sel.appendChild(o); });
  }

  renderObjetivos();
  renderLimites();
  renderDetalheCategorias();
}

/* ------------------------------ OBJETIVOS (localStorage por enquanto) ------------------------------ */
function getObjetivos() { return JSON.parse(localStorage.getItem('objetivos') || '[]'); }
function setObjetivos(list) { localStorage.setItem('objetivos', JSON.stringify(list)); }

function renderObjetivos() {
  const list = getObjetivos();
  document.getElementById('objList').innerHTML = list.map((o, idx) => {
    const pct = Math.min(100, Math.round((o.guardado / o.meta) * 100));
    return `<div class="obj-card">
      <div class="obj-top">
        <span>${o.nome}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="pct">${pct}%</span>
          <button class="obj-excluir" data-idx="${idx}" title="Excluir objetivo" style="border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:0">&times;</button>
        </span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="obj-values" data-idx="${idx}" style="cursor:pointer" title="Clique para editar o valor guardado">
        <span class="obj-guardado">${fmtMoeda(o.guardado)}</span> / ${fmtMoeda(o.meta)} <span style="text-decoration:underline">editar</span>
      </div>
    </div>`;
  }).join('') || '<p style="font-size:13px;color:var(--text-muted)">Nenhum objetivo cadastrado ainda.</p>';

  // Excluir objetivo
  document.querySelectorAll('.obj-excluir').forEach(btn => {
    btn.onclick = function (e) {
      e.stopPropagation();
      const idx = parseInt(this.dataset.idx);
      if (!confirm('Excluir este objetivo?')) return;
      const l = getObjetivos();
      l.splice(idx, 1);
      setObjetivos(l);
      renderObjetivos();
    };
  });

  // Clique no valor guardado -> vira input editável
  document.querySelectorAll('.obj-values').forEach(el => {
    el.onclick = function () {
      const idx = parseInt(this.dataset.idx);
      const listAtual = getObjetivos();
      const atual = listAtual[idx].guardado;
      this.innerHTML = `<input type="text" inputmode="decimal" value="${atual.toString().replace('.', ',')}" style="width:90px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;font-size:12px">`;
      const input = this.querySelector('input');
      input.focus();
      input.select();
      const salvar = () => {
        const novo = parseFloat(input.value.replace(/\./g, '').replace(',', '.')) || 0;
        const l = getObjetivos();
        l[idx].guardado = novo;
        setObjetivos(l);
        renderObjetivos();
      };
      input.onblur = salvar;
      input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
      input.onclick = e => e.stopPropagation();
    };
  });
}

/* ------------------------------ Limites de gastos (localStorage) ------------------------------ */
function getLimites() { return JSON.parse(localStorage.getItem('limites') || '[]'); }
function setLimites(list) { localStorage.setItem('limites', JSON.stringify(list)); }

function gastoDoTermo(termo, mes) {
  const t = termo.trim().toLowerCase();
  return dados
    .filter(d => d.tipo !== 'entrada')
    .filter(d => d.onde.toLowerCase() === t || d.produto.toLowerCase().includes(t))
    .filter(d => d.fixo
      ? (d.data.getFullYear() < mes.getFullYear() || (d.data.getFullYear() === mes.getFullYear() && d.data.getMonth() <= mes.getMonth()))
      : (d.data.getFullYear() === mes.getFullYear() && d.data.getMonth() === mes.getMonth()))
    .reduce((acc, d) => acc + d.valorTotal, 0);
}

function renderLimites() {
  const list = getLimites();
  document.getElementById('limitesList').innerHTML = list.map((l, idx) => {
    const gasto = gastoDoTermo(l.termo, mesSelecionado);
    const pct = Math.min(100, Math.round((gasto / l.limite) * 100));
    const estourou = gasto > l.limite;
    const cor = estourou ? 'var(--red)' : (pct >= 80 ? 'var(--amber)' : 'var(--accent)');
    return `<div class="kpi-card" style="position:relative" id="limiteCard${idx}">
      <div style="position:absolute;top:10px;right:10px;display:flex;gap:8px">
        <button class="limite-editar" data-idx="${idx}" title="Editar limite" style="border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:0;text-decoration:underline">editar</button>
        <button class="limite-excluir" data-idx="${idx}" title="Excluir limite" style="border:none;background:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:0">&times;</button>
      </div>
      <p class="label">${l.nome}</p>
      <p class="value" style="font-size:16px;color:${cor}">${fmtMoeda(gasto)} <span style="font-size:12px;color:var(--text-muted);font-weight:400">/ ${fmtMoeda(l.limite)}</span></p>
      <div class="progress-track" style="margin-top:8px"><div class="progress-fill" style="width:${pct}%;background:${cor}"></div></div>
    </div>`;
  }).join('') || '<p style="font-size:13px;color:var(--text-muted);grid-column:1/-1">Nenhum limite cadastrado ainda.</p>';

  document.querySelectorAll('.limite-excluir').forEach(btn => {
    btn.onclick = function () {
      const idx = parseInt(this.dataset.idx);
      if (!confirm('Excluir este limite?')) return;
      const l = getLimites();
      l.splice(idx, 1);
      setLimites(l);
      renderLimites();
    };
  });

  document.querySelectorAll('.limite-editar').forEach(btn => {
    btn.onclick = function () {
      const idx = parseInt(this.dataset.idx);
      const l = getLimites()[idx];
      const card = document.getElementById('limiteCard' + idx);
      card.innerHTML = `
        <label style="font-size:11px;color:var(--text-muted)">Nome</label>
        <input id="editNome${idx}" value="${l.nome}" style="width:100%;padding:5px 7px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:13px">
        <label style="font-size:11px;color:var(--text-muted)">Categoria/palavra-chave</label>
        <input id="editTermo${idx}" value="${l.termo}" style="width:100%;padding:5px 7px;margin-bottom:6px;border:1px solid var(--border);border-radius:6px;font-size:13px">
        <label style="font-size:11px;color:var(--text-muted)">Limite mensal</label>
        <input id="editLimite${idx}" value="${l.limite.toString().replace('.', ',')}" style="width:100%;padding:5px 7px;margin-bottom:8px;border:1px solid var(--border);border-radius:6px;font-size:13px">
        <button id="salvarEdicaoLimite${idx}" style="width:100%;padding:7px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-size:13px">Salvar</button>
      `;
      document.getElementById('salvarEdicaoLimite' + idx).onclick = () => {
        const nome = document.getElementById('editNome' + idx).value.trim();
        const termo = document.getElementById('editTermo' + idx).value.trim();
        const limite = parseFloat(document.getElementById('editLimite' + idx).value.replace(/\./g, '').replace(',', '.'));
        if (!nome || !termo || !limite) return;
        const listAtual = getLimites();
        listAtual[idx] = { nome, termo, limite };
        setLimites(listAtual);
        renderLimites();
      };
    };
  });
}

/* ------------------------------ Detalhamento por categoria (seletor único) ------------------------------ */
function renderDetalheCategorias() {
  const sel = document.getElementById('categoriaSelect');
  const el = document.getElementById('categoriaDetalhe');
  if (!sel || !el) return;

  if (categorias.length === 0) { el.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">Sem dados ainda.</p>'; return; }

  // Popula o select preservando a categoria já escolhida, se ainda existir
  const anterior = sel.value;
  sel.innerHTML = categorias.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = categorias.includes(anterior) ? anterior : categorias[0];

  const desenharDetalhe = () => {
    const cat = sel.value;
    const doMes = dados.filter(d => d.tipo !== 'entrada'
      && d.data.getFullYear() === mesSelecionado.getFullYear()
      && d.data.getMonth() === mesSelecionado.getMonth()
      && d.onde === cat);
    const total = doMes.reduce((acc, d) => acc + d.valorTotal, 0);
    const linhas = doMes.length
      ? doMes.map(d => `<div class="cat-linha">
          <span class="desc">${d.produto}${d.fixo ? ' <span class="info">(recorrente)</span>' : (d.total > 1 ? ` <span class="info">(${d.total}x)</span>` : '')}</span>
          <span class="info">${fmtMoeda(d.valorTotal)}</span>
        </div>`).join('')
      : '<div class="cat-linha"><span class="info">Nenhum gasto nessa categoria neste mês.</span></div>';
    el.innerHTML = `<div class="cat-item">
      <div class="cat-header" style="cursor:default">
        <span>${cat}</span>
        <span class="cat-total">${fmtMoeda(total)}</span>
      </div>
      <div class="cat-lista aberto">${linhas}</div>
    </div>`;
  };

  sel.onchange = desenharDetalhe;
  desenharDetalhe();
}

/* ------------------------------ KPIs editáveis ------------------------------ */
function tornarEditavel(cardId, valueId, storageKey) {
  document.getElementById(cardId).onclick = function () {
    const valEl = document.getElementById(valueId);
    const atual = parseFloat(localStorage.getItem(storageKey) || '0');
    valEl.innerHTML = `<input type="text" inputmode="decimal" value="${atual.toString().replace('.', ',')}">`;
    const input = valEl.querySelector('input');
    input.focus();
    input.select();
    const salvar = () => {
      const novo = parseFloat(input.value.replace(/\./g, '').replace(',', '.')) || 0;
      localStorage.setItem(storageKey, novo);
      render();
    };
    input.onblur = salvar;
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  };
}

document.getElementById('salvarGastoBtn').onclick = async () => {
  const status = document.getElementById('formStatus');
  const produto = document.getElementById('fProduto').value.trim();
  const valor = parseFloat(document.getElementById('fValor').value.replace(',', '.'));
  const categoria = document.getElementById('fCategoria').value;
  const fixo = document.getElementById('fFixo').checked;
  const totalParcelas = parseInt(document.getElementById('fParcelas').value) || 1;

  if (!produto || !valor) { status.textContent = 'Preencha produto e valor.'; return; }

  if (!APPS_SCRIPT_URL) {
    status.textContent = 'Endpoint de escrita ainda não configurado (ver instruções de setup).';
    return;
  }

  status.textContent = 'Salvando…';
  try {
    const hoje = new Date();
    const dataFmt = String(hoje.getDate()).padStart(2, '0') + '-' + String(hoje.getMonth() + 1).padStart(2, '0') + '-' + hoje.getFullYear();
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        'Descrição': produto,
        Categoria: categoria,
        Tipo: 'saida',
        Data: dataFmt,
        Valor: valor,
        MetodoPagamento: formaPagamento === 'Pix' ? 'PIX' : 'CREDITO',
        Cartao: formaPagamento === 'Pix' ? '' : formaPagamento,
        Parcelas: fixo ? 'Recorrente' : totalParcelas
      })
    });
    status.textContent = 'Gasto adicionado.';
    document.getElementById('fProduto').value = '';
    document.getElementById('fValor').value = '';
    carregarDados(); // recarrega a planilha para refletir o novo gasto
  } catch (e) {
    status.textContent = 'Erro ao salvar. Tente novamente.';
  }
};

/* ------------------------------ Carregamento ------------------------------ */
function carregarDados() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';

  const aoTerminar = (rows) => {
    dados = rows.map(parseLinha).filter(r => r.produto)
      // Ignora lançamentos de teste/calibração anteriores a DATA_INICIO —
      // mas mantém gastos "Recorrente" mesmo que tenham começado antes, já que
      // são compromissos recorrentes ainda ativos.
      .filter(r => r.fixo || r.data >= DATA_INICIO);
    categorias = [...new Set([...CATEGORIAS_PADRAO, ...dados.map(d => d.onde)])];
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    render();
  };

  if (!CSV_URL) {
    aoTerminar(DADOS_EXEMPLO);
    return;
  }

  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    complete: (results) => aoTerminar(results.data),
    error: () => {
      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('errorMsg').textContent = 'Não foi possível carregar a planilha. Usando dados de exemplo.';
      aoTerminar(DADOS_EXEMPLO);
    }
  });
}

carregarDados();
